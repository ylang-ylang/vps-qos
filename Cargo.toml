[package]
name = "vps-bandwidth-observer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Passive VPS bandwidth observation with a constant-space windowed extremum filter"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
